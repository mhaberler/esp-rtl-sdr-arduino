[platformio]
default_envs = esp32p4_waveshare_devkit

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
upload_speed = 1500000
lib_ldf_mode = deep+

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O3
    -DPERF_STATS

#lib_deps = https://github.com/hardcoreerik/esp-rtl-sdr.git
lib_deps = https://github.com/Lunarhop/esp-rtl-sdr#codex/nooelec-smart-v5-r820t2
; ---------------------------------------------------------
; MCU base — ESP32-P4
; ---------------------------------------------------------
[esp32p4]
board_build.mcu = esp32p4
; board_build.f_cpu = 360000000L
board_build.f_cpu = 400000000L   ; 400 MHz if supported (rev ≥300), else 360000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.f_psram = 200000000L
build_unflags = -Os
board_build.custom_sdkconfig =
    CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=1024
    CONFIG_ESP_RTL_SDR_SMOKE_URB_6X16K=y
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=4
; ---------------------------------------------------------
; ESP32-P4-Module High-performance Development Board,
; Based On ESP32-P4 And ESP32-C6, Supports Wi-Fi 6 And Bluetooth 5/BLE
; https://www.waveshare.com/product/esp32-related/boards-kits/esp32-p4/esp32-p4-module-dev-kit.htm
; ---------------------------------------------------------
[env:esp32p4_waveshare_devkit]
extends = esp32p4
board = esp32-p4-evboard
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    ${esp32p4.build_flags}
    -DARDUINO_ESP32_P4_EVBOARD
    -DUSB_VBUS_EN_GPIO=46

; ---------------------------------------------------------
; M5Stack StampP4 (esp-hosted C6 co-processor over SDIO for WiFi;
; irrelevant to USB Host/RTL-SDR but the pins must stay reserved)
; https://docs.m5stack.com/en/core/Stamp-P4
; ---------------------------------------------------------
[env:m5stack-stampp4]
extends = esp32p4
board = esp32-p4_r3
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    ${esp32p4.build_flags}
    -DARDUINO_M5STACK_STAMPP4
    -DBOARD_SDIO_CUSTOM_PINS
    -DCUSTOM_SDIO_ESP_HOSTED_CLK=43
    -DCUSTOM_SDIO_ESP_HOSTED_CMD=44
    -DCUSTOM_SDIO_ESP_HOSTED_D0=45
    -DCUSTOM_SDIO_ESP_HOSTED_D1=46
    -DCUSTOM_SDIO_ESP_HOSTED_D2=47
    -DCUSTOM_SDIO_ESP_HOSTED_D3=48
    -DCUSTOM_SDIO_ESP_HOSTED_RESET=42

; ---------------------------------------------------------
; M5Stack Tab5
;
; Named m5stack-tab5-m5unified for parity with sensorpod's env
; naming, but M5Unified is NOT linked here: this app runs its own
; app_main()/FreeRTOS tasks (no Arduino setup()/loop()), and linking
; M5Unified drags in Arduino's main.cpp, which defines app_main()
; too — duplicate-symbol link error. Add M5Unified back only if this
; app grows a real use for it (display, button, power mgmt) and its
; entry point is reworked to go through setup()/loop() instead.
; ---------------------------------------------------------
[env:m5stack-tab5-m5unified]
extends = esp32p4
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    ${esp32p4.build_flags}
    -DARDUINO_M5STACK_TAB5
    -DBOARD_SDMMC_POWER_CHANNEL=4
